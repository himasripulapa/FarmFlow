<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388E3C" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBC02D" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>
  </defs>
  <!-- Background soft circle -->
  <circle cx="50" cy="50" r="46" fill="#F1F8E9" />
  
  <!-- Flowing arrow path representing farm-to-fork supply chain -->
  <path d="M 22 68 C 28 42, 52 38, 72 32 C 64 50, 44 58, 30 74 Z" fill="url(#flowGrad)" />
  
  <!-- Stylized leaf representing agriculture -->
  <path d="M 50 18 C 76 18, 82 46, 78 72 C 54 72, 32 60, 50 18 Z" fill="url(#leafGrad)" opacity="0.95" />
  
  <!-- Leaf vein -->
  <path d="M 50 18 C 55 38, 62 52, 70 66" stroke="#C8E6C9" stroke-width="2.5" stroke-linecap="round" fill="none" />
  
  <!-- Flow dot -->
  <circle cx="24" cy="68" r="4" fill="#F57F17" />
  <circle cx="76" cy="30" r="4" fill="#2E7D32" />
</svg>